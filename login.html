<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — The Mint</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body style="background:var(--off-white)">
<nav>
  <a href="index.html" class="logo">The <span>Mint</span></a>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="learn.html">Learn</a></li>
    <li><a href="tools.html">Tools</a></li>
    <li><a href="about.html">About</a></li>
  </ul>
</nav>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:100px 24px 60px">
  <div style="width:100%;max-width:420px">
    <div style="text-align:center;margin-bottom:36px">
      <div class="logo" style="font-size:28px;display:block;margin-bottom:8px">The <span>Mint</span></div>
      <p style="color:var(--text-muted);font-size:15px">Sign in to your account</p>
    </div>
    <div class="card" style="padding:40px">
      <div id="login-form">
        <div class="field"><label>EMAIL ADDRESS</label><input type="email" id="login-email" placeholder="you@example.com"></div>
        <div class="field"><label>PASSWORD</label><input type="password" id="login-password" placeholder="••••••••"></div>
        <div style="display:flex;justify-content:flex-end;margin-bottom:20px"><a href="#" style="font-size:13px;color:var(--mint)">Forgot password?</a></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="handleLogin()">Sign In</button>
        <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted)">
          Don't have an account? <a href="#" style="color:var(--mint);font-weight:600">Open one today →</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
<script>
function handleLogin() {
  const email = document.getElementById('login-email').value;
  const pass  = document.getElementById('login-password').value;
  if (!email || !pass) { alert('Please enter your email and password.'); return; }
  // Demo: redirect to accounts
  window.location.href = 'accounts.html';
}
</script>
</body>
</html>
