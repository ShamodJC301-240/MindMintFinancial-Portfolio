<!-- Account Card Template (populated via accounts.js) -->
<!-- Usage: dynamically rendered by accounts.js from data/accounts.json -->
<div class="acct-card primary-card">
  <div>
    <div class="acct-label">{{type}} Account</div>
    <div class="acct-value white" data-balance>$0.00</div>
    <div style="color:rgba(255,255,255,0.6);font-size:13px;margin-top:4px">{{number}}</div>
  </div>
</div>
